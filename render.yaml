services:
  - type: web
    name: fotoinsight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python database/seed_data.py --reset
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT "wsgi:app"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: instance/fotoinsight.db
      - key: FIREBASE_DB_URL
        sync: false
      - key: FIREBASE_AUTH_TOKEN
        sync: false
