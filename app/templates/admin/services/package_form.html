{% extends "admin/base.html" %}
{% block title %}{{ "Edit package" if package else "Add package" }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ "Edit package" if package else "Add package" }}</h1></div></div>
<form class="stack panel" data-api="{{ url_for('services.api_update_package', package_id=package.id) if package else url_for('services.api_create_package') }}" data-method="{{ 'PUT' if package else 'POST' }}" data-redirect="{{ url_for('services.service_list') }}">
  <div class="alert alert-danger form-alert d-none"></div>
  <label>Service<select name="service_id" required>{% for service in services %}<option value="{{ service.id }}" {{ 'selected' if package and package.service_id==service.id else '' }}>{{ service.name }}</option>{% endfor %}</select></label>
  <label>Name<input name="name" required value="{{ package.name if package else '' }}"></label>
  <label>Description<textarea name="description" rows="3">{{ package.description or '' if package else '' }}</textarea></label>
  <label>Inclusions<textarea name="inclusions" rows="3">{{ package.inclusions or '' if package else '' }}</textarea></label>
  <label>Price<input name="price" type="number" min="0" step="0.01" required value="{{ package.price if package else '' }}"></label>
  <label>Status<select name="status"><option value="active">Active</option><option value="inactive" {{ 'selected' if package and package.status=='inactive' else '' }}>Inactive</option></select></label>
  <button class="btn-gold" type="submit">Save package</button>
</form>
{% endblock %}
