{% extends "admin/base.html" %}
{% block title %}{{ "Edit payment" if payment else "Record payment" }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ "Edit payment" if payment else "Record payment" }}</h1><p class="sub">A refund is its own row. Do not erase the original receipt.</p></div></div>
<form class="stack panel" data-api="{{ url_for('payments.api_update', payment_id=payment.id) if payment else url_for('payments.api_create') }}" data-method="{{ 'PUT' if payment else 'POST' }}" data-redirect="{{ url_for('payments.payment_list') }}">
  <div class="alert alert-danger form-alert d-none"></div>
  <label>Booking
    <select name="booking_id" required>{% for booking in bookings %}<option value="{{ booking.id }}" {{ 'selected' if (payment and payment.booking_id==booking.id) or (selected_booking|string == booking.id|string) else '' }}>{{ booking.booking_code }} · {{ booking.customer_name }} · {{ booking.event_name }}</option>{% endfor %}</select>
  </label>
  <label>Amount<input name="amount" type="number" min="0.01" step="0.01" required value="{{ payment.amount if payment else '' }}"></label>
  <label>Date<input name="payment_date" type="date" required value="{{ payment.payment_date if payment else '' }}"></label>
  <label>Method<select name="method">{% for key, label in payment_methods %}<option value="{{ key }}" {{ 'selected' if payment and payment.method==key else '' }}>{{ label }}</option>{% endfor %}</select></label>
  <label>Status<select name="status">{% for key, label in payment_statuses %}<option value="{{ key }}" {{ 'selected' if payment and payment.status==key else '' }}>{{ label }}</option>{% endfor %}</select></label>
  <label>Transaction reference<input name="transaction_ref" value="{{ payment.transaction_ref or '' if payment else '' }}"></label>
  <label>Notes<input name="notes" value="{{ payment.notes or '' if payment else '' }}"></label>
  <button class="btn-gold" type="submit">Save payment</button>
</form>
{% if payment %}
<button class="btn-quiet mt-3" type="button" data-delete="{{ url_for('payments.api_delete', payment_id=payment.id) }}" data-after="{{ url_for('payments.payment_list') }}">Delete payment</button>
{% endif %}
{% endblock %}
