<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Studio login · FotoInsight</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Outfit:wght@360;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
  <style>
    body.login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at top, rgba(156, 122, 69, 0.12), transparent 55%),
        linear-gradient(180deg, #f7f4ef 0%, #efe8dc 100%);
    }
    .login-card {
      width: min(100%, 440px);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2rem 1.75rem 1.85rem;
      box-shadow: 0 18px 40px rgba(28, 25, 21, 0.06);
    }
    .login-card .brand { display: inline-block; margin-bottom: 0.35rem; }
    .login-card h1 { font-size: 2.4rem; line-height: 1; margin: 0.4rem 0 0.7rem; }
    .login-card .lede { margin-bottom: 1.4rem; font-size: 1rem; }
    .login-card .form-label { display: block; margin-bottom: 0.35rem; font-size: 0.92rem; }
    .login-card .form-control { width: 100%; display: block; }
    .login-card .btn-gold {
      width: 100%;
      border: 0;
      cursor: pointer;
      margin-top: 0.35rem;
      font: inherit;
    }
    .login-card .btn-gold:disabled { opacity: 0.65; cursor: wait; }
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="{{ url_for('public.home') }}">FotoInsight</a>
    <h1>Studio login</h1>
    <p class="lede">Administrators manage the whole studio. Employees see the enquiries, customers, bookings, and projects assigned to them.</p>
    <form id="login-form" data-api="{{ url_for('auth.login_api') }}" data-method="POST">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="alert alert-danger form-alert d-none"></div>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-gold" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const alertBox = form.querySelector(".form-alert");
      const button = form.querySelector("[type=submit]");
      button.disabled = true;
      const body = {};
      new FormData(form).forEach((value, key) => { body[key] = value; });
      try {
        const response = await fetch(form.dataset.api, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": document.querySelector('meta[name=csrf-token]').content,
            "X-Requested-With": "fetch",
          },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not sign in.");
        window.location.href = data.redirect || "/admin/";
      } catch (error) {
        alertBox.textContent = error.message;
        alertBox.classList.remove("d-none");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
